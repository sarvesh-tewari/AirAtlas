# TEMPORARY diagnostic: why does the CPCB (data.gov.in) live fetch fail in CI but work
# from a laptop? Runs the exact fetch on a GitHub runner and prints status/body/UA variants.
# Delete once the CPCB-in-CI failure is understood.
name: cpcb-probe

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install pipeline
        run: pip install -e ./pipeline
      - name: Probe data.gov.in from the runner
        env:
          DATA_GOV_IN_KEY: ${{ secrets.DATA_GOV_IN_KEY }}
        run: |
          python - <<'PY'
          import os, json, traceback, httpx
          RESOURCE="3b01bcb8-0b14-4abf-b6f2-c1bfd384ba69"
          BASE=f"https://api.data.gov.in/resource/{RESOURCE}"
          key=os.environ.get("DATA_GOV_IN_KEY","")
          print("key present:", bool(key), "len:", len(key))
          try:
              ip=httpx.get("https://api.ipify.org", timeout=15).text
              print("runner egress IP:", ip)
          except Exception as e:
              print("ip lookup failed:", e)
          print("key stripped len:", len(key.strip()))
          UA={"User-Agent":"Mozilla/5.0 (X11; Linux x86_64) airatlas"}
          for label, headers, k in [
              ("default-UA + stripped key", None, key.strip()),
              ("browser-UA + stripped key", UA, key.strip()),
          ]:
              params={"api-key":k,"format":"json","limit":5}
              print(f"\n=== attempt: {label} ===")
              try:
                  r=httpx.get(BASE, params=params, headers=headers, timeout=30)
                  print("status:", r.status_code)
                  print("resp headers:", dict(r.headers))
                  body=r.text
                  print("body[:600]:", body[:600])
              except Exception as e:
                  print("EXC:", type(e).__name__, e)
                  traceback.print_exc()
          # 2) run the real pipeline path so we see the actual RuntimeError message
          print("\n=== real cpcb.fetch_live path ===")
          from ingest import cpcb
          try:
              recs=cpcb.fetch_live(key, limit=5000)
              print("fetch_live OK, records:", len(recs))
          except Exception as e:
              print("fetch_live raised:", type(e).__name__, e)
          PY
