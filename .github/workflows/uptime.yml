# External uptime / synthetic check. Independent of the data pipeline: on a schedule it loads
# the PUBLIC live site and asserts it is up, serves the app, and has fresh data — so the site
# being down/broken/stale raises a GitHub issue (-> email) without anyone checking it manually.
name: uptime

on:
  schedule:
    - cron: "*/30 * * * *" # every 30 minutes
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write
  actions: read

# Don't pile up overlapping checks; a new run supersedes a stuck one.
concurrency:
  group: uptime
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Synthetic check of the live site
        run: |
          set -o pipefail
          node scripts/smoke.mjs "https://sarvesh-tewari.github.io/AirAtlas/" 2>&1 | tee /tmp/smoke.log

      - name: Alert on failure / auto-close on recovery
        if: always()
        uses: ./.github/actions/alert
        with:
          status: ${{ job.status }}
          workflow: ${{ github.workflow }}
          log-path: /tmp/smoke.log
          tail-lines: "30"
          note: "The live site failed its synthetic check (down, broken, or data missing/stale)."
